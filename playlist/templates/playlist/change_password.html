{% extends "playlist/layout.html" %}

{% block body %}
    <h2>Change Password</h2>

    {% if message %}
        <div>{{ message }}</div>
    {% endif %}

    <form action="{% url 'change_password' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <input autofocus class="form-control" type="password" name="current_password" placeholder="Current Password">
        </div>
        <div class="form-group">
            <input class="form-control" type="password" name="new_password" placeholder="New Password">
        </div>
        <div class="form-group">
            <input class="form-control" type="password" name="confirmation" placeholder="Confirm New Password">
        </div>
        <input class="btn btn-primary" type="submit" value="Change Password">
    </form>
{% endblock %}
