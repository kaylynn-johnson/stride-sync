{% extends "playlist/layout.html" %}

{% block body %}
    <h1>{{ user.username.capitalize }}'s Recommendations</h1>
    {% if recommendations %}
        <ul>
            {% for recommendation in recommendations %}
                <li>{{ recommendation }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No recommendations available.</p>
    {% endif %}
{% endblock %}
