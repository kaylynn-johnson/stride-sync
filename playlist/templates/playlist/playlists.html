{% extends "playlist/layout.html" %}
{% load static %}

{% block script %}
    <script src="{% static 'playlist/playlists.js' %}"></script>
{% endblock %}

{% block body %}
    {% if user.is_authenticated %}
        <h1>{{ user.username.capitalize }}'s Playlists</h1>
    {% else %}
        <h1>Public Playlists</h1>
    {% endif %}

    <div id="all-playlists"></div>

{% endblock %}
